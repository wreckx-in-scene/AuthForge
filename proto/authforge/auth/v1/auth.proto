syntax = "proto3";

package authforge.auth.v1;

option go_package = "github.com/wreckx-in-scene/AuthForge/gen/authforge/auth/v1;authv1";

service AuthService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc VerificationKeys(VerificationKeysRequest) returns (VerificationKeysResponse);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc GoogleLogin(GoogleLoginRequest) returns (GoogleLoginResponse);
  rpc CreateGoogleNonce(CreateGoogleNonceRequest) returns (CreateGoogleNonceResponse);
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  rpc ExchangeAuthorizationCode(ExchangeAuthorizationCodeRequest) returns (ExchangeAuthorizationCodeResponse);
}

message SignUpRequest {
  string environment_id = 1;
  string project_id = 2;
  string email = 3;
  string password = 4;
}

message SignUpResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  string user_id = 4;
  string session_id = 5;
  bool email_verified = 6;
}

message LoginRequest {
  string environment_id = 1;
  string project_id = 2;
  string email = 3;
  string password = 4;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  string user_id = 4;
  string session_id = 5;
  bool email_verified = 6;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  string user_id = 4;
  string session_id = 5;
  bool email_verified = 6;
}

message LogoutRequest {
  string refresh_token = 1;
  string session_id = 2;
  string environment_id = 3;
}

message LogoutResponse {
  string session_id = 1;
}

message VerificationKeysRequest {}

message VerificationKeysResponse {
  string kid = 1;
  bytes public_key = 2;
  string alg = 3;
}

message RequestEmailVerificationRequest {
  string environment_id = 1;
  string email = 2;
}

message RequestEmailVerificationResponse {}

message VerifyEmailRequest {
  string environment_id = 1;
  string token = 2;
}

message VerifyEmailResponse {
  bool verified = 1;
}

message GoogleLoginRequest {
  string environment_id = 1;
  string project_id = 2;
  string id_token = 3;
  string nonce = 4;
}

message GoogleLoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 access_expires_at = 3;
  string user_id = 4;
  string session_id = 5;
  bool email_verified = 6;
}

message CreateGoogleNonceRequest {
  string environment_id = 1;
}

message CreateGoogleNonceResponse {
  string nonce = 1;
}

message AuthorizeRequest {
  string environment_id = 1;
  string project_id = 2;
  string client_id = 3;
  string redirect_uri = 4;
  string code_challenge = 5;
  string nonce = 6;
  string email = 7;
  string password = 8;
  bool signup = 9;
}

message AuthorizeResponse {
  string code = 1;
  int64 expires_at = 2;
}

message ExchangeAuthorizationCodeRequest {
  string code = 1;
  string client_id = 2;
  string redirect_uri = 3;
  string code_verifier = 4;
}

message ExchangeAuthorizationCodeResponse {
  string access_token = 1;
  string refresh_token = 2;
  string id_token = 3;
  int64 access_expires_at = 4;
  string user_id = 5;
  string session_id = 6;
  bool email_verified = 7;
}
