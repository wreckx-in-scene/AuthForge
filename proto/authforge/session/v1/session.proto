syntax = "proto3";

package authforge.session.v1;

option go_package = "github.com/wreckx-in-scene/AuthForge/gen/authforge/session/v1;sessionv1";

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc RotateRefreshToken(RotateRefreshTokenRequest) returns (RotateRefreshTokenResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc IssueAuthorizationCode(IssueAuthorizationCodeRequest) returns (IssueAuthorizationCodeResponse);
  rpc ExchangeAuthorizationCode(ExchangeAuthorizationCodeRequest) returns (ExchangeAuthorizationCodeResponse);
}

message CreateSessionRequest {
  string environment_id = 1;
  string project_id = 2;
  string user_id = 3;
}

message CreateSessionResponse {
  string session_id = 1;
  string environment_id = 2;
  string project_id = 3;
  string user_id = 4;
  string refresh_token = 5;
  int64 refresh_expires_at = 6;
}

message RotateRefreshTokenRequest {
  string refresh_token = 1;
}

message RotateRefreshTokenResponse {
  string session_id = 1;
  string environment_id = 2;
  string project_id = 3;
  string user_id = 4;
  string refresh_token = 5;
  int64 refresh_expires_at = 6;
}

message RevokeSessionRequest {
  string refresh_token = 1;
  string session_id = 2;
  string environment_id = 3;
}

message RevokeSessionResponse {
  string session_id = 1;
}

message IssueAuthorizationCodeRequest {
  string environment_id = 1;
  string project_id = 2;
  string user_id = 3;
  string client_id = 4;
  string redirect_uri = 5;
  string code_challenge = 6;
  string nonce = 7;
}

message IssueAuthorizationCodeResponse {
  string code = 1;
  int64 expires_at = 2;
}

message ExchangeAuthorizationCodeRequest {
  string code = 1;
  string client_id = 2;
  string redirect_uri = 3;
  string code_verifier = 4;
}

message ExchangeAuthorizationCodeResponse {
  string session_id = 1;
  string environment_id = 2;
  string project_id = 3;
  string user_id = 4;
  string refresh_token = 5;
  int64 refresh_expires_at = 6;
  string nonce = 7;
}
