syntax = "proto3";

package authforge.tenant.v1;

option go_package = "github.com/wreckx-in-scene/AuthForge/gen/authforge/tenant/v1;tenantv1";

service TenantService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc LoginAccount(LoginAccountRequest) returns (LoginAccountResponse);
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  rpc IssueAPIKey(IssueAPIKeyRequest) returns (IssueAPIKeyResponse);
  rpc ResolveAPIKey(ResolveAPIKeyRequest) returns (ResolveAPIKeyResponse);
}

message Account {
  string id = 1;
  string email = 2;
  string name = 3;
}

message CreateAccountRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message CreateAccountResponse {
  string access_token = 1;
  int64 expires_at = 2;
  Account account = 3;
}

message LoginAccountRequest {
  string email = 1;
  string password = 2;
}

message LoginAccountResponse {
  string access_token = 1;
  int64 expires_at = 2;
  Account account = 3;
}

message CreateOrganizationRequest {
  string account_id = 1;
  string name = 2;
  string slug = 3;
}

message CreateOrganizationResponse {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message CreateProjectRequest {
  string account_id = 1;
  string organization_id = 2;
  string name = 3;
  string slug = 4;
}

message CreateProjectResponse {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string slug = 4;
}

message CreateEnvironmentRequest {
  string account_id = 1;
  string project_id = 2;
  string name = 3;
}

message CreateEnvironmentResponse {
  string id = 1;
  string project_id = 2;
  string organization_id = 3;
  string name = 4;
}

message IssueAPIKeyRequest {
  string account_id = 1;
  string environment_id = 2;
  string key_class = 3;
}

message IssueAPIKeyResponse {
  string id = 1;
  string environment_id = 2;
  string key = 3;
  string key_class = 4;
  string prefix = 5;
}

message ResolveAPIKeyRequest {
  string key = 1;
}

message ResolveAPIKeyResponse {
  string key_id = 1;
  string organization_id = 2;
  string project_id = 3;
  string environment_id = 4;
  string key_class = 5;
  string environment_name = 6;
}
