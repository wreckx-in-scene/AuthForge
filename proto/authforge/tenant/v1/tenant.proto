syntax = "proto3";

package authforge.tenant.v1;

option go_package = "github.com/wreckx-in-scene/AuthForge/gen/authforge/tenant/v1;tenantv1";

service TenantService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc LoginAccount(LoginAccountRequest) returns (LoginAccountResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc IssueAPIKey(IssueAPIKeyRequest) returns (IssueAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  rpc CreateOAuthClient(CreateOAuthClientRequest) returns (CreateOAuthClientResponse);
  rpc ListOAuthClients(ListOAuthClientsRequest) returns (ListOAuthClientsResponse);
  rpc DeleteOAuthClient(DeleteOAuthClientRequest) returns (DeleteOAuthClientResponse);
  rpc ResolveOAuthClient(ResolveOAuthClientRequest) returns (ResolveOAuthClientResponse);
  rpc ResolveAPIKey(ResolveAPIKeyRequest) returns (ResolveAPIKeyResponse);
}

message Account {
  string id = 1;
  string email = 2;
  string name = 3;
}

message CreateAccountRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message CreateAccountResponse {
  string access_token = 1;
  int64 expires_at = 2;
  Account account = 3;
}

message LoginAccountRequest {
  string email = 1;
  string password = 2;
}

message LoginAccountResponse {
  string access_token = 1;
  int64 expires_at = 2;
  Account account = 3;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  reserved 1, 2;
}

message ResetPasswordRequest {
  string reset_token = 1;
  string password = 2;
}

message ResetPasswordResponse {
  bool ok = 1;
}

message CreateOrganizationRequest {
  string account_id = 1;
  string name = 2;
  string slug = 3;
}

message CreateOrganizationResponse {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message ListOrganizationsRequest {
  string account_id = 1;
}

message OrganizationRecord {
  string id = 1;
  string name = 2;
  string slug = 3;
}

message ListOrganizationsResponse {
  repeated OrganizationRecord organizations = 1;
}

message CreateProjectRequest {
  string account_id = 1;
  string organization_id = 2;
  string name = 3;
  string slug = 4;
}

message CreateProjectResponse {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string slug = 4;
}

message ListProjectsRequest {
  string account_id = 1;
  string organization_id = 2;
}

message ProjectRecord {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string slug = 4;
}

message ListProjectsResponse {
  repeated ProjectRecord projects = 1;
}

message CreateEnvironmentRequest {
  string account_id = 1;
  string project_id = 2;
  string name = 3;
}

message CreateEnvironmentResponse {
  string id = 1;
  string project_id = 2;
  string organization_id = 3;
  string name = 4;
}

message ListEnvironmentsRequest {
  string account_id = 1;
  string project_id = 2;
}

message EnvironmentRecord {
  string id = 1;
  string project_id = 2;
  string organization_id = 3;
  string name = 4;
}

message ListEnvironmentsResponse {
  repeated EnvironmentRecord environments = 1;
}

message IssueAPIKeyRequest {
  string account_id = 1;
  string environment_id = 2;
  string key_class = 3;
}

message IssueAPIKeyResponse {
  string id = 1;
  string environment_id = 2;
  string key = 3;
  string key_class = 4;
  string prefix = 5;
}

message ListAPIKeysRequest {
  string account_id = 1;
  string environment_id = 2;
}

message APIKeyRecord {
  string id = 1;
  string environment_id = 2;
  string key_class = 3;
  string prefix = 4;
  string status = 5;
  int64 created_at = 6;
}

message ListAPIKeysResponse {
  repeated APIKeyRecord keys = 1;
}

message RevokeAPIKeyRequest {
  string account_id = 1;
  string key_id = 2;
}

message RevokeAPIKeyResponse {
  bool revoked = 1;
}

message CreateOAuthClientRequest {
  string account_id = 1;
  string environment_id = 2;
  string name = 3;
  repeated string redirect_uris = 4;
}

message OAuthClient {
  string client_id = 1;
  string environment_id = 2;
  string project_id = 3;
  string name = 4;
  repeated string redirect_uris = 5;
}

message CreateOAuthClientResponse {
  OAuthClient client = 1;
}

message ListOAuthClientsRequest {
  string account_id = 1;
  string environment_id = 2;
}

message ListOAuthClientsResponse {
  repeated OAuthClient clients = 1;
}

message DeleteOAuthClientRequest {
  string account_id = 1;
  string client_id = 2;
}

message DeleteOAuthClientResponse {
  bool deleted = 1;
}

message ResolveOAuthClientRequest {
  string client_id = 1;
}

message ResolveOAuthClientResponse {
  OAuthClient client = 1;
}

message ResolveAPIKeyRequest {
  string key = 1;
}

message ResolveAPIKeyResponse {
  string key_id = 1;
  string organization_id = 2;
  string project_id = 3;
  string environment_id = 4;
  string key_class = 5;
  string environment_name = 6;
}
