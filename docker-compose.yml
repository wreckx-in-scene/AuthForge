version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: authforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authforge
      POSTGRES_PASSWORD: authforge
      POSTGRES_DB: authforge
    ports:
      - "5432:5432"
    volumes:
      - authforge_pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  authforge_pg_data:
